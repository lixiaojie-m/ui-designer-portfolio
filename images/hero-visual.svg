<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3d00"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>
  
  <!-- Floating elements -->
  <rect x="100" y="150" width="250" height="250" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <rect x="450" y="250" width="250" height="500" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="650" cy="150" r="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  
  <!-- Typography -->
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#ffffff" opacity="0.05">UI</text>
  <text x="400" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="url(#accent)" opacity="0.2">UX</text>
  
  <!-- Decorative dots -->
  <circle cx="150" cy="700" r="8" fill="#ff3d00"/>
  <circle cx="180" cy="700" r="8" fill="#ffffff" opacity="0.2"/>
  <circle cx="210" cy="700" r="8" fill="#ffffff" opacity="0.1"/>
  
  <!-- Abstract shapes -->
  <polygon points="600,800 700,900 500,900" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <rect x="100" y="850" width="300" height="3" fill="url(#accent)" opacity="0.5"/>
</svg>