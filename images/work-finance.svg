<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2137"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Dashboard card -->
  <rect x="40" y="30" width="720" height="440" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
  
  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="50" rx="16" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="40" y="64" width="720" height="16" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="75" cy="55" r="14" fill="#1e293b"/>
  <text x="75" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff" opacity="0.6">李</text>
  <rect x="100" y="48" width="60" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="100" y="60" width="40" height="5" rx="2" fill="#ffffff" opacity="0.08"/>
  
  <text x="700" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.3">Dashboard</text>
  
  <!-- Stats row -->
  <rect x="70" y="100" width="155" height="80" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="90" y="125" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.4">总资产</text>
  <text x="90" y="155" font-family="monospace" font-size="20" fill="#10b981">¥328,450</text>
  <text x="90" y="172" font-family="sans-serif" font-size="9" fill="#10b981">↑ 12.5%</text>
  
  <rect x="245" y="100" width="155" height="80" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="265" y="125" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.4">今日收益</text>
  <text x="265" y="155" font-family="monospace" font-size="20" fill="#ffffff">¥1,280</text>
  <text x="265" y="172" font-family="sans-serif" font-size="9" fill="#10b981">↑ 8.3%</text>
  
  <rect x="420" y="100" width="155" height="80" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="440" y="125" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.4">持仓数量</text>
  <text x="440" y="155" font-family="monospace" font-size="20" fill="#ffffff">12</text>
  <text x="440" y="172" font-family="sans-serif" font-size="9" fill="#ffffff" opacity="0.3">支基金</text>
  
  <rect x="595" y="100" width="135" height="80" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="615" y="125" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.4">风险等级</text>
  <rect x="615" y="138" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="615" y="138" width="40" height="6" rx="3" fill="#f59e0b"/>
  <text x="615" y="162" font-family="sans-serif" font-size="10" fill="#f59e0b">稳健型</text>
  
  <!-- Chart area -->
  <rect x="70" y="200" width="420" height="200" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="90" y="225" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.6">收益走势</text>
  
  <!-- Chart line -->
  <polyline points="100,370 140,355 180,360 220,340 260,345 300,320 340,310 380,325 420,290 460,275" 
            fill="none" stroke="url(#green)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Area under chart -->
  <polygon points="100,370 140,355 180,360 220,340 260,345 300,320 340,310 380,325 420,290 460,275 460,370" 
           fill="url(#green)" opacity="0.1"/>
  
  <!-- Y-axis labels -->
  <text x="90" y="375" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.2">0</text>
  <text x="82" y="315" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.2">5k</text>
  <text x="78" y="280" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.2">10k</text>
  
  <!-- Fund list -->
  <rect x="510" y="200" width="220" height="200" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="530" y="225" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.6">持仓明细</text>
  
  <!-- Fund item 1 -->
  <rect x="525" y="240" width="190" height="36" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <text x="540" y="256" font-family="sans-serif" font-size="9" fill="#ffffff" opacity="0.7">沪深300指数</text>
  <text x="540" y="270" font-family="monospace" font-size="9" fill="#ffffff" opacity="0.4">¥50,000</text>
  <text x="690" y="262" font-family="monospace" font-size="10" fill="#10b981">+5.2%</text>
  
  <!-- Fund item 2 -->
  <rect x="525" y="284" width="190" height="36" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <text x="540" y="300" font-family="sans-serif" font-size="9" fill="#ffffff" opacity="0.7">中证500增强</text>
  <text x="540" y="314" font-family="monospace" font-size="9" fill="#ffffff" opacity="0.4">¥38,000</text>
  <text x="690" y="306" font-family="monospace" font-size="10" fill="#10b981">+3.8%</text>
  
  <!-- Fund item 3 -->
  <rect x="525" y="328" width="190" height="36" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <text x="540" y="344" font-family="sans-serif" font-size="9" fill="#ffffff" opacity="0.7">纳斯达克100</text>
  <text x="540" y="358" font-family="monospace" font-size="9" fill="#ffffff" opacity="0.4">¥28,500</text>
  <text x="690" y="350" font-family="monospace" font-size="10" fill="#10b981">+12.1%</text>
  
  <!-- Bottom tab bar -->
  <rect x="40" y="430" width="720" height="40" rx="0" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="40" y="454" width="720" height="16" rx="0 0 16 16" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="160" cy="450" r="4" fill="#10b981"/>
  <circle cx="300" cy="450" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="440" cy="450" r="4" fill="#ffffff" opacity="0.2"/>
  <circle cx="580" cy="450" r="4" fill="#ffffff" opacity="0.2"/>
</svg>