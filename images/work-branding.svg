<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#2d1f2d"/>
      <stop offset="100%" style="stop-color:#1f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3d00"/>
      <stop offset="50%" style="stop-color:#ff6d00"/>
      <stop offset="100%" style="stop-color:#ff9800"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Brand logo large -->
  <text x="400" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="180" fill="#ffffff" opacity="0.03">B</text>
  
  <!-- Logo mark -->
  <g transform="translate(320, 120)">
    <!-- Abstract B shape -->
    <path d="M0 0 L0 180 L60 180 C120 180 160 160 160 100 C160 60 130 50 110 50 L110 48 C140 40 140 20 140 0 L80 0 C100 30 100 45 80 45 L60 45 L60 0 Z M60 90 L70 90 C100 90 100 130 70 130 L60 130 Z" 
          fill="url(#accent)"/>
  </g>
  
  <!-- Brand name -->
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#ffffff" letter-spacing="8" opacity="0.9">BRAND</text>
  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="11" fill="url(#accent)" letter-spacing="6">IDENTITY DESIGN</text>
  
  <!-- Color palette -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#ff3d00"/>
    <rect x="70" y="0" width="60" height="40" rx="4" fill="#ffffff"/>
    <rect x="140" y="0" width="60" height="40" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="210" y="0" width="60" height="40" rx="4" fill="#333333"/>
    <rect x="280" y="0" width="60" height="40" rx="4" fill="#666666"/>
    <text x="175" y="60" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.3">COLOR PALETTE</text>
  </g>
  
  <!-- Decorative elements -->
  <rect x="50" y="50" width="120" height="1" fill="#ffffff" opacity="0.1"/>
  <rect x="50" y="55" width="80" height="1" fill="#ff3d00" opacity="0.5"/>
  
  <rect x="630" y="50" width="120" height="1" fill="#ffffff" opacity="0.1"/>
  <rect x="680" y="55" width="80" height="1" fill="#ff3d00" opacity="0.5"/>
  
  <!-- Typography sample -->
  <g transform="translate(580, 160)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="12" fill="#ffffff" opacity="0.3">Aa</text>
    <text x="30" y="0" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.3">Aa</text>
    <rect x="0" y="15" width="60" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="0" y="35" font-family="Georgia, serif" font-size="9" fill="#ffffff" opacity="0.2">Playfair</text>
    <text x="0" y="50" font-family="monospace" font-size="9" fill="#ffffff" opacity="0.2">Space Mono</text>
  </g>
  
  <!-- Grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="470" r="2"/>
    <circle cx="100" cy="470" r="2"/>
    <circle cx="120" cy="470" r="2"/>
    <circle cx="140" cy="470" r="2"/>
    <circle cx="660" cy="470" r="2"/>
    <circle cx="680" cy="470" r="2"/>
    <circle cx="700" cy="470" r="2"/>
    <circle cx="720" cy="470" r="2"/>
  </g>
</svg>