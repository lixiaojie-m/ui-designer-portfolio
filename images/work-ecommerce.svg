<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f5f0"/>
      <stop offset="100%" style="stop-color:#ebe6de"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3d00"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Phone mockup -->
  <rect x="280" y="30" width="240" height="440" rx="20" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="295" y="70" width="210" height="370" rx="4" fill="#fafafa"/>
  
  <!-- Status bar -->
  <rect x="295" y="70" width="210" height="24" fill="#0a0a0a"/>
  <text x="400" y="86" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">9:41</text>
  
  <!-- Search bar -->
  <rect x="310" y="108" width="180" height="28" rx="14" fill="#f0f0f0"/>
  <text x="340" y="126" font-family="sans-serif" font-size="10" fill="#999">搜索商品...</text>
  
  <!-- Banner -->
  <rect x="310" y="148" width="180" height="80" rx="8" fill="url(#accent)" opacity="0.15"/>
  <rect x="310" y="148" width="180" height="80" rx="8" fill="none" stroke="#ff3d00" stroke-width="1" opacity="0.3"/>
  <text x="400" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#0a0a0a">限时特惠</text>
  <text x="400" y="208" text-anchor="middle" font-family="monospace" font-size="20" fill="#ff3d00" font-weight="bold">5折起</text>
  
  <!-- Product grid -->
  <g>
    <rect x="310" y="242" width="85" height="100" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="318" y="250" width="68" height="50" rx="4" fill="#f5f5f5"/>
    <rect x="318" y="310" width="50" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="318" y="322" width="40" height="10" rx="2" fill="#ff3d00" opacity="0.7"/>
    <text x="360" y="330" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#ffffff">加入购物车</text>
    
    <rect x="405" y="242" width="85" height="100" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="413" y="250" width="68" height="50" rx="4" fill="#f5f5f5"/>
    <rect x="413" y="310" width="50" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="413" y="322" width="40" height="10" rx="2" fill="#ff3d00" opacity="0.7"/>
    <text x="455" y="330" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#ffffff">加入购物车</text>
    
    <rect x="310" y="352" width="85" height="100" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="318" y="360" width="68" height="50" rx="4" fill="#f5f5f5"/>
    <rect x="318" y="420" width="50" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="318" y="432" width="40" height="10" rx="2" fill="#ff3d00" opacity="0.7"/>
    
    <rect x="405" y="352" width="85" height="100" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="413" y="360" width="68" height="50" rx="4" fill="#f5f5f5"/>
    <rect x="413" y="420" width="50" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="413" y="432" width="40" height="10" rx="2" fill="#ff3d00" opacity="0.7"/>
  </g>
  
  <!-- Tab bar -->
  <rect x="295" y="416" width="210" height="24" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="335" cy="428" r="3" fill="#ff3d00"/>
  <circle cx="375" cy="428" r="3" fill="#ccc"/>
  <circle cx="415" cy="428" r="3" fill="#ccc"/>
  <circle cx="455" cy="428" r="3" fill="#ccc"/>
  
  <!-- Decorative labels -->
  <rect x="40" y="180" width="180" height="30" rx="2" fill="#0a0a0a"/>
  <text x="55" y="200" font-family="monospace" font-size="11" fill="#ffffff">E-COMMERCE APP</text>
  
  <text x="40" y="160" font-family="Georgia, serif" font-size="28" fill="#0a0a0a">电商体验重构</text>
  <text x="40" y="230" font-family="sans-serif" font-size="12" fill="#666">转化率提升 38%</text>
  
  <!-- Side decoration -->
  <rect x="600" y="100" width="3" height="300" fill="url(#accent)" opacity="0.3"/>
  <rect x="650" y="150" width="100" height="6" rx="3" fill="#e0e0e0"/>
  <rect x="650" y="170" width="80" height="4" rx="2" fill="#e0e0e0"/>
  <rect x="650" y="190" width="120" height="4" rx="2" fill="#e0e0e0"/>
</svg>