<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Component cards floating -->
  <g opacity="0.9">
    <!-- Card 1 - Button -->
    <rect x="80" y="80" width="220" height="160" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="120" y="120" font-family="monospace" font-size="9" fill="#7c3aed" letter-spacing="2">BUTTONS</text>
    <rect x="120" y="140" width="80" height="32" rx="6" fill="url(#accent)"/>
    <text x="160" y="161" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">Primary</text>
    <rect x="210" y="140" width="60" height="32" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="240" y="161" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">Ghost</text>
    <rect x="120" y="186" width="150" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="195" y="207" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Secondary</text>
  </g>
  
  <!-- Card 2 - Colors -->
  <g opacity="0.9">
    <rect x="360" y="60" width="180" height="200" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="400" y="100" font-family="monospace" font-size="9" fill="#7c3aed" letter-spacing="2">COLORS</text>
    <circle cx="400" cy="140" r="18" fill="#7c3aed"/>
    <circle cx="450" cy="140" r="18" fill="#3b82f6"/>
    <circle cx="500" cy="140" r="18" fill="#06b6d4"/>
    <circle cx="400" cy="190" r="18" fill="#10b981"/>
    <circle cx="450" cy="190" r="18" fill="#f59e0b"/>
    <circle cx="500" cy="190" r="18" fill="#ef4444"/>
    <rect x="390" y="220" width="80" height="6" rx="3" fill="#e0e0e0" opacity="0.2"/>
  </g>
  
  <!-- Card 3 - Typography -->
  <g opacity="0.9">
    <rect x="600" y="120" width="160" height="180" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="630" y="160" font-family="monospace" font-size="9" fill="#7c3aed" letter-spacing="2">TYPE</text>
    <text x="630" y="190" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.8">Aa</text>
    <text x="630" y="215" font-family="sans-serif" font-size="14" fill="#ffffff" opacity="0.5">Heading</text>
    <text x="630" y="238" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.35">Body text</text>
    <text x="630" y="258" font-family="sans-serif" font-size="9" fill="#ffffff" opacity="0.25">Caption</text>
    <rect x="630" y="272" width="100" height="4" rx="2" fill="#e0e0e0" opacity="0.15"/>
    <rect x="630" y="282" width="80" height="4" rx="2" fill="#e0e0e0" opacity="0.1"/>
  </g>
  
  <!-- Card 4 - Spacing -->
  <g opacity="0.7">
    <rect x="120" y="290" width="200" height="150" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="150" y="325" font-family="monospace" font-size="9" fill="#7c3aed" letter-spacing="2">SPACING</text>
    <!-- Spacing visualization -->
    <rect x="150" y="345" width="40" height="20" rx="4" fill="url(#accent)" opacity="0.5"/>
    <text x="170" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">4px</text>
    <rect x="200" y="345" width="60" height="20" rx="4" fill="url(#accent)" opacity="0.4"/>
    <text x="230" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">8px</text>
    <rect x="270" y="345" width="30" height="20" rx="4" fill="url(#accent)" opacity="0.3"/>
    
    <rect x="150" y="380" width="80" height="20" rx="4" fill="url(#accent)" opacity="0.4"/>
    <text x="190" y="395" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">16px</text>
    <rect x="240" y="380" width="60" height="20" rx="4" fill="url(#accent)" opacity="0.3"/>
    <text x="270" y="395" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">24px</text>
  </g>
  
  <!-- Connecting lines -->
  <line x1="300" y1="160" x2="360" y2="160" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="540" y1="160" x2="600" y2="210" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Labels -->
  <text x="400" y="480" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.3" letter-spacing="3">DESIGN SYSTEM</text>
</svg>